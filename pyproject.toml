[project]
name = "osm-tags-to-object"
version = "0.1.0"
description = "Download OSM ways + relations matching a set of tags; stream to GeoJSON or Parquet."
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.1",
    "folium>=0.20.0",
    "pyarrow>=24.0.0",
]

[project.scripts]
osm-tags-to-object = "osm_tags_to_object.cli:cli"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_tags_to_object"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
